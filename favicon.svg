<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#050706"/>

  <!-- IC chip body -->
  <rect x="9" y="9" width="14" height="14" rx="1" fill="none" stroke="#38ff8b" stroke-width="1.5"/>

  <!-- Chip pins — top -->
  <line x1="13" y1="9" x2="13" y2="5" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="16" y1="9" x2="16" y2="5" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="19" y1="9" x2="19" y2="5" stroke="#38ff8b" stroke-width="1.2"/>

  <!-- Chip pins — bottom -->
  <line x1="13" y1="23" x2="13" y2="27" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="16" y1="23" x2="16" y2="27" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="19" y1="23" x2="19" y2="27" stroke="#38ff8b" stroke-width="1.2"/>

  <!-- Chip pins — left -->
  <line x1="9" y1="13" x2="5" y2="13" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="9" y1="16" x2="5" y2="16" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="9" y1="19" x2="5" y2="19" stroke="#38ff8b" stroke-width="1.2"/>

  <!-- Chip pins — right -->
  <line x1="23" y1="13" x2="27" y2="13" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="23" y1="16" x2="27" y2="16" stroke="#38ff8b" stroke-width="1.2"/>
  <line x1="23" y1="19" x2="27" y2="19" stroke="#38ff8b" stroke-width="1.2"/>

  <!-- Geometric "A" inside the chip — circuit-style -->
  <!-- Two angled legs rising to a peak -->
  <polyline points="12,20 16,12 20,20" fill="none" stroke="#38ff8b" stroke-width="1.4" stroke-linejoin="miter"/>
  <!-- Crossbar -->
  <line x1="13.5" y1="17" x2="18.5" y2="17" stroke="#38ff8b" stroke-width="1.2"/>
</svg>
